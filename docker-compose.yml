version: "3.9"

services:
  # ── MongoDB for local development ─────────────────────────────────────────
  # Start just the database with:  docker compose up -d mongo
  # Then use MONGODB_URI=mongodb://localhost:27017 in backend/.env
  mongo:
    image: mongo:7
    container_name: sociosolve_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - sociosolve_net

  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sociosolve_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
    networks:
      - sociosolve_net

  # ── Frontend (React + Vite) ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sociosolve_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sociosolve_net

networks:
  sociosolve_net:
    driver: bridge

volumes:
  mongo_data:
